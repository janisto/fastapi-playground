[project]
name = "fastapi-playground-functions"
version = "0.1.0"
description = "Firebase Cloud Functions for fastapi-playground"
requires-python = ">=3.15"
dependencies = [
    "firebase-admin>=7.7.0",
    "firebase-functions>=0.6.0",
    "genkit>=0.12.0",
    "genkit-google-genai>=0.12.0",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "werkzeug>=3.1.9",
]

[tool.uv]
required-version = ">=0.13.1"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # google-genai 2.31.0 still imports this private typing class on Python 3.15.
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3\\.17:DeprecationWarning:google\\.genai\\.types",
]
