[project]
name = "fastapi-playground-functions"
version = "0.1.0"
description = "Firebase Cloud Functions for fastapi-playground"
requires-python = ">=3.14"
dependencies = [
    "firebase-admin>=7.5.0",
    "firebase-functions>=0.6.0",
    "genkit>=0.8.1",
    "genkit-google-genai>=0.8.1",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "werkzeug>=3.1.8",
]

[tool.uv]
required-version = ">=0.11.28"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Remove these module-scoped filters when the upstream packages stop emitting warnings.
    'ignore::UserWarning:dotpromptz\.typing',
    'ignore::DeprecationWarning:google\.genai\.types',
]
