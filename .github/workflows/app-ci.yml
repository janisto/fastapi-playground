name: App validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.15'
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'

      - name: Install dependencies
        run: just install

      - name: Install Functions dependencies
        run: just install-functions

      - name: Check Python style
        run: just lint

      - name: Check app types
        run: just typing

      - name: Check Functions types
        run: just typing-functions

      - name: Verify Functions deployment requirements
        run: just check-functions-requirements

  tests:
    name: App and Functions tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.15'
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: '1.59.0'

      - name: Install dependencies
        run: just install

      - name: Install Functions dependencies
        run: just install-functions

      - name: Run Functions tests
        run: just test-functions

      - name: Run app coverage
        id: test-coverage
        run: just cov

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.test-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: htmlcov
          if-no-files-found: error

  container:
    name: Container build and smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build application container
        run: docker build --build-arg "VERSION=$IMAGE_VERSION" --tag fastapi-playground:test .
        env:
          IMAGE_VERSION: ${{ github.sha }}

      - name: Verify runtime version and user
        run: |
          docker run --rm --entrypoint python fastapi-playground:test -c \
            'import os, sys; assert sys.version_info[:3] == (3, 15, 0); assert (os.getuid(), os.getgid()) == (1001, 1001)'

      - name: Smoke startup, health, and graceful shutdown
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::8080 fastapi-playground:test)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          port="$(docker port "$container_id" 8080/tcp | sed 's/.*://')"
          ready=false
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/health" >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/health" | jq --exit-status '. == {"status": "healthy"}'

          docker stop --time 10 "$container_id" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" -eq 0
          docker rm "$container_id" >/dev/null
          trap - EXIT

  actionlint:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
        env:
          ZIZMOR_OFFLINE: 'true'
        with:
          version: '1.31.1'
          persona: pedantic
          online-audits: false
          advanced-security: false

  ci:
    name: ci
    if: always()
    needs: [quality, tests, container, actionlint, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every validation job to succeed
        run: |
          if [[ "$QUALITY_RESULT" != success || "$TESTS_RESULT" != success ||
                "$CONTAINER_RESULT" != success || "$ACTIONLINT_RESULT" != success ||
                "$ZIZMOR_RESULT" != success ]]; then
            printf '%s\n' 'A required validation job failed, was cancelled, or was skipped.' >&2
            exit 1
          fi
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
