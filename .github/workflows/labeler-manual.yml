name: Manually Label PRs

on:
  workflow_dispatch:
    inputs:
      maxCount:
        description: "Max number of PRs to process"
        required: true
        default: 200
        type: number
      scope:
        description: "Which PRs to consider: 'closed' or 'all'"
        required: true
        default: "closed"
        type: choice
        options:
          - "closed"
          - "all"

concurrency:
  group: label-prs
  cancel-in-progress: false

permissions: {}

jobs:
  collect-prs:
    name: Collect pull requests
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read # Enumerate pull requests selected by the operator.

    outputs:
      pr_numbers: ${{ steps.get_prs.outputs.pr_numbers }}
      pr_count: ${{ steps.get_prs.outputs.pr_count }}

    steps:
      - name: Get all closed PR numbers
        id: get_prs
        uses: actions/github-script@v9.0.0
        with:
          retries: 3
          script: |
            const maxCount = Number(process.env.INPUT_MAX_COUNT);
            if (!Number.isInteger(maxCount) || maxCount < 1 || maxCount > 256) {
              core.setFailed("maxCount must be an integer from 1 through 256");
              return;
            }

            const state = process.env.INPUT_SCOPE;

            const allPRs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state,
              per_page: 100
            });

            const prNumbersAll = allPRs.map(pr => pr.number).sort((a, b) => a - b);
            const prNumbers = prNumbersAll.slice(0, maxCount);

            core.info(`Collected ${prNumbers.length} ${state} PRs (max ${maxCount}): ${prNumbers.slice(0,20).join(", ")}...`);

            core.setOutput("pr_numbers", JSON.stringify(prNumbers));
            core.setOutput("pr_count", String(prNumbers.length));
        env:
          INPUT_MAX_COUNT: ${{ github.event.inputs.maxCount }}
          INPUT_SCOPE: ${{ github.event.inputs.scope }}

  label-prs-matrix:
    name: Label pull request ${{ matrix.pr }}
    if: needs.collect-prs.outputs.pr_count != '0'
    needs: collect-prs

    runs-on: ubuntu-latest

    permissions:
      contents: read # Read the labeler configuration from the default branch.
      pull-requests: write # Apply labels to the selected pull request.

    strategy:
      max-parallel: 10
      matrix:
        pr: ${{ fromJson(needs.collect-prs.outputs.pr_numbers) }}

    steps:
      - name: Run labeler
        uses: actions/labeler@v7.0.0
        with:
          pr-number: ${{ matrix.pr }}
          configuration-path: .github/labeler.yml
          sync-labels: true
