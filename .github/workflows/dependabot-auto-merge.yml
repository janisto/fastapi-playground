# Automatically approve and merge Dependabot PRs for minor and patch updates
name: Dependabot auto-merge

on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Approve safe Dependabot update
    runs-on: ubuntu-latest

    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'janisto/fastapi-playground'

    permissions:
      contents: write # Enable the squash merge.
      issues: write # Add the automerge label through the issues API.
      pull-requests: write # Approve the pull request and enable auto-merge.

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr edit "$PR_URL" --add-label "automerge"
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
